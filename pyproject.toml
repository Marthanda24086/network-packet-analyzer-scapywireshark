[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netscope"
version = "1.0.0"
description = "NetScope - Packet Sniffing & Protocol Analysis Tool"
authors = [{ name = "B.Tech CSE Student Project" }]
dependencies = [
    "scapy>=2.5.0",
    "PySide6>=6.5.0",
    "matplotlib>=3.7.0",
    "pytest>=7.3.0"
]
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
